# Render blueprint for the API. The frontend deploys separately on Vercel (frontend/vercel.json).
services:
  - type: web
    name: brutal-audience-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_API_KEY      # set in the Render dashboard, never commit it
        sync: false
      - key: LLM_MODEL        # copy a current model ID from your provider
        sync: false
      - key: CORS_ORIGINS     # your Vercel URL, e.g. https://brutal-audience.vercel.app
        sync: false
      - key: JWT_SECRET       # signs login tokens; Render generates a random value once
        generateValue: true
      - key: DATABASE_PATH
        value: ./brutal_audience.db
